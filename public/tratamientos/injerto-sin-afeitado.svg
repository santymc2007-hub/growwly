    <path d="M225 260 C 210 280 205 300 215 320"/>
    <path d="M235 270 C 222 292 218 312 228 332"/>
    <path d="M248 280 C 236 302 233 322 244 340"/>
    <path d="M260 290 C 250 312 248 330 258 348"/>
  </g>

  <!-- Uno de los mechones extraído con su folículo, sin rapar alrededor -->
