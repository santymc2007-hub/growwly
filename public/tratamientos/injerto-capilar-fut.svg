<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgFut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#96ceb7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#61c5f1" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgFut)"/>

  <g stroke="#1f5568" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 130 C 260 130 220 190 220 250 C 220 300 250 340 250 370
             L 250 400 L 330 400 L 330 360
             C 380 370 440 350 460 300
             C 480 250 470 190 430 155
             C 400 130 365 125 330 130 Z" />
    <path d="M255 255 C 240 255 235 275 250 285" />
  </g>

  <!-- Tira extraída de la zona donante (línea marcada) -->
  <path d="M240 290 C 260 315 285 330 315 335" stroke="#1f5568" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M240 290 C 260 315 285 330 315 335" stroke="#61c5f1" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="1 8"/>

  <!-- Representación de la tira aparte, dividida en unidades -->
  <g transform="translate(480,250) rotate(8)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="none" stroke="#1f5568" stroke-width="3"/>
    <g stroke="#61c5f1" stroke-width="2">
      <line x1="20" y1="0" x2="20" y2="26"/>
      <line x1="45" y1="0" x2="45" y2="26"/>
      <line x1="70" y1="0" x2="70" y2="26"/>
      <line x1="95" y1="0" x2="95" y2="26"/>
      <line x1="120" y1="0" x2="120" y2="26"/>
      <line x1="145" y1="0" x2="145" y2="26"/>
    </g>
  </g>
  <path d="M330 320 C 400 300 440 280 470 260" stroke="#1f5568" stroke-width="2.5" fill="none" stroke-dasharray="3 6" opacity="0.6"/>

  <!-- Nuevos injertos en zona frontal -->
  <g fill="#2fbf6b">
    <circle cx="400" cy="170" r="6"/>
    <circle cx="415" cy="185" r="6"/>
    <circle cx="425" cy="200" r="6"/>
  </g>

  <g stroke="#1f5568" stroke-width="2.5" fill="none" opacity="0.5">
    <circle cx="620" cy="130" r="14"/>
    <circle cx="660" cy="160" r="8"/>
  </g>
</svg>
