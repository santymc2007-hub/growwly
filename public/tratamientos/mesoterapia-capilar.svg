<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgMeso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#96ceb7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#61c5f1" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgMeso)"/>

  <!-- Cabeza vista desde arriba -->
  <circle cx="400" cy="230" r="150" stroke="#1f5568" stroke-width="4" fill="none"/>
  <!-- pelo (líneas radiales suaves) -->
  <g stroke="#1f5568" stroke-width="1.5" opacity="0.35">
    <line x1="400" y1="230" x2="400" y2="100"/>
    <line x1="400" y1="230" x2="460" y2="110"/>
    <line x1="400" y1="230" x2="510" y2="150"/>
    <line x1="400" y1="230" x2="530" y2="230"/>
    <line x1="400" y1="230" x2="510" y2="310"/>
    <line x1="400" y1="230" x2="460" y2="350"/>
    <line x1="400" y1="230" x2="400" y2="380"/>
    <line x1="400" y1="230" x2="340" y2="350"/>
    <line x1="400" y1="230" x2="290" y2="310"/>
    <line x1="400" y1="230" x2="270" y2="230"/>
    <line x1="400" y1="230" x2="290" y2="150"/>
    <line x1="400" y1="230" x2="340" y2="110"/>
  </g>

  <!-- Microinyecciones repartidas -->
  <g stroke="#1f5568" stroke-width="3" fill="none" stroke-linecap="round">
    <g transform="translate(340,150) rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="28"/>
      <circle cx="0" cy="0" r="3" fill="#1f5568"/>
    </g>
    <g transform="translate(420,140) rotate(-10)">
      <line x1="0" y1="0" x2="0" y2="28"/>
      <circle cx="0" cy="0" r="3" fill="#1f5568"/>
    </g>
    <g transform="translate(470,190) rotate(20)">
      <line x1="0" y1="0" x2="0" y2="28"/>
      <circle cx="0" cy="0" r="3" fill="#1f5568"/>
    </g>
    <g transform="translate(340,260) rotate(-50)">
      <line x1="0" y1="0" x2="0" y2="28"/>
      <circle cx="0" cy="0" r="3" fill="#1f5568"/>
    </g>
    <g transform="translate(450,280) rotate(40)">
      <line x1="0" y1="0" x2="0" y2="28"/>
      <circle cx="0" cy="0" r="3" fill="#1f5568"/>
    </g>
    <g transform="translate(390,320) rotate(0)">
      <line x1="0" y1="0" x2="0" y2="28"/>
      <circle cx="0" cy="0" r="3" fill="#1f5568"/>
    </g>
  </g>

  <!-- Gotas de producto -->
  <g fill="#61c5f1" opacity="0.8">
    <circle cx="340" cy="150" r="4"/>
    <circle cx="420" cy="140" r="4"/>
    <circle cx="470" cy="190" r="4"/>
    <circle cx="340" cy="260" r="4"/>
    <circle cx="450" cy="280" r="4"/>
    <circle cx="390" cy="320" r="4"/>
  </g>
</svg>
