<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgMicro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#96ceb7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#61c5f1" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgMicro)"/>

  <!-- Cabeza vista desde arriba -->
  <circle cx="400" cy="230" r="150" stroke="#1f5568" stroke-width="4" fill="none"/>

  <!-- Patrón de puntos de pigmento, densidad decreciente hacia el borde -->
  <g fill="#1f5568">
    <!-- centro, más denso -->
    <circle cx="400" cy="230" r="2.5"/>
    <circle cx="410" cy="222" r="2.5"/>
    <circle cx="392" cy="220" r="2.5"/>
    <circle cx="418" cy="238" r="2.5"/>
    <circle cx="384" cy="238" r="2.5"/>
    <circle cx="400" cy="248" r="2.5"/>
    <circle cx="425" cy="212" r="2.2"/>
    <circle cx="375" cy="210" r="2.2"/>
    <circle cx="430" cy="248" r="2.2"/>
    <circle cx="370" cy="248" r="2.2"/>
    <circle cx="415" cy="260" r="2.2"/>
    <circle cx="385" cy="262" r="2.2"/>
    <!-- anillo medio -->
    <circle cx="440" cy="195" r="2" opacity="0.85"/>
    <circle cx="360" cy="195" r="2" opacity="0.85"/>
    <circle cx="450" cy="230" r="2" opacity="0.85"/>
    <circle cx="350" cy="230" r="2" opacity="0.85"/>
    <circle cx="440" cy="270" r="2" opacity="0.85"/>
    <circle cx="360" cy="270" r="2" opacity="0.85"/>
    <circle cx="400" cy="290" r="2" opacity="0.85"/>
    <circle cx="400" cy="175" r="2" opacity="0.85"/>
    <!-- anillo exterior, más disperso -->
    <circle cx="470" cy="180" r="1.6" opacity="0.55"/>
    <circle cx="330" cy="180" r="1.6" opacity="0.55"/>
    <circle cx="480" cy="230" r="1.6" opacity="0.55"/>
    <circle cx="320" cy="230" r="1.6" opacity="0.55"/>
    <circle cx="470" cy="285" r="1.6" opacity="0.55"/>
    <circle cx="330" cy="285" r="1.6" opacity="0.55"/>
  </g>

  <!-- Aguja de micropigmentación -->
  <g transform="translate(510,110) rotate(35)" stroke="#1f5568" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="0" x2="70" y2="0"/>
    <rect x="70" y="-10" width="34" height="20" rx="4"/>
    <circle cx="0" cy="0" r="3" fill="#1f5568"/>
  </g>
</svg>
